[package]
name = "zt-fsm-engine"
version = "2.4.0"
edition = "2021"
rust-version = "1.75"
description = "ZT-AI-CORE L6: детерминированный FSM-движок (матрица Lifecycle×Mode, WAL-атомарность, Pending Rollback Counter, A/B-обновления)"
license = "Apache-2.0"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ed25519-dalek = "2"
libc = "0.2"
zt-hal-common = { path = "../hal-common", version = "2.4.0" }

[dev-dependencies]
tempfile = "3"

[lib]
name = "zt_fsm_engine"
path = "src/lib.rs"

[[bin]]
name = "zt-fsm-engine"
path = "src/main.rs"
